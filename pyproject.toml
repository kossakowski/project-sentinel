[tool.pytest.ini_options]
# --strict-markers turns an unregistered (for example misspelled) marker into a
# collection error instead of a silently ignored no-op.
addopts = "--strict-markers"
markers = [
    "integration: marks tests that require network/API access",
    "slow: subprocess smoke tests and other slow tests; deselect with -m \"not slow\"",
    "network: tests that need real network access; the conftest socket guard refuses every non-loopback connection",
]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (import ordering)
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (common bugs)
    "SIM",  # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["sentinel"]
