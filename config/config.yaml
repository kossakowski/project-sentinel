geography:
  # Whole countries treated as HIGH geo-tier: a military strike anywhere on their
  # soil (including their capital) is call-tier-eligible. Romania joined the
  # monitored HIGH set 2026-07. Country resolution stays LLM-driven and
  # country-level -- there is NO gazetteer/city list (a strike in "Galați"
  # resolves to Romania exactly as "Warsaw" resolves to Poland).
  high_tier_countries:
  - PL
  - LT
  - LV
  - EE
  - RO
  # Classifier event_type values counted as a kinetic strike. Consumed by the
  # GeoWeighter Poland floor and the Phase 3 kinetic separator. Deliberately
  # excludes debris_found / official_statement (inert debris and reactions are
  # not kinetic strikes -- PL debris is 8/sms, not a call).
  kinetic_event_types:
  - invasion
  - airstrike
  - missile_strike
  - artillery_shelling
  - drone_attack
  # Countries whose soil, when a kinetic strike lands, floors the event to the
  # call tier (>= 9). Poland only: every kinetic strike on Polish soil in the
  # ground truth is 9-10/call; Baltic/Romanian call-tier is scenario-conditional
  # (carried by the classifier prompt + eval gates, not a universal floor).
  floor_countries:
  - PL
  # Countries the classifier may name that are KNOWN but not HIGH: their soil is
  # LOW geo tier (interior Ukraine / Moldova / Russia). Only a country listed here
  # (or above) can demote a 9-10 to an SMS -- an UNRECOGNIZED country token is
  # UNKNOWN and fails OPEN to a phone call. Add a country here only if you want a
  # call-urgency event on its soil to become an SMS.
  low_tier_countries:
  - UA
  - MD
  - RU
  - BY
  # Countries whose soil, when attacked BY a NATO member, is HIGH geo tier (the
  # R11 case: NATO is now kinetically engaged with Russia).
  nato_attack_targets:
  - RU
