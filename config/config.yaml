processing:
  dedup:
    same_source_title_threshold: 85
    cross_source_title_threshold: 95
    lookback_minutes: 60
classification:
  model: claude-haiku-4-5-20251001
  max_tokens: 512
  temperature: 0.0
  corroboration_window_minutes: 360
  # Absolute cap (from first_seen_at) on how long one event keeps absorbing
  # articles; retires a perpetually-updated event so it can't chain-merge
  # distinct incidents. 0 disables. 2880 = 48h.
  corroboration_max_age_minutes: 2880
  # Fuzzy metric + threshold (0-100) for matching two summaries to one event.
  # token_set_ratio is length-robust (short headline vs long elaboration);
  # lower threshold = more aggressive grouping (tune here without a code deploy).
  summary_similarity_metric: token_set_ratio
  summary_similarity_threshold: 50
alerts:
  phone_number: ${ALERT_PHONE_NUMBER}
  language: pl
  # Urgency -> channel-class bands (rubric v2). AlertPolicy's single band map:
  # >= 9 -> call, 5-8 -> notify (SMS/push), <= 4 -> none (persisted, no alert).
  # The per-tier `urgency_levels.*.channel` below still routes a NOTIFY band to
  # sms/push/both; these bands only pick the class.
  channel_bands:
  - min_score: 9
    channel_class: call
  - min_score: 5
    channel_class: notify
  - min_score: 1
    channel_class: none
  # Delivery routing per tier. The CLASS (call / notify / none) is decided by
  # channel_bands above -- these levels only carry the fine-grained delivery
  # channel for a NOTIFY-band event (sms | push | both).
  urgency_levels:
    critical:
      min_score: 9
      action: phone_call
      retry_interval_minutes: 5
    high:
      min_score: 7
      action: sms
      # Delivery channel for this tier: sms | push | both. "both" is
      # behavior-preserving while push is disabled (SMS only); switch to "push"
      # to drop this tier's Twilio SMS cost once a push token is configured.
      channel: both
    medium:
      min_score: 5
      action: sms
      # Delivery channel: sms | push | both (see `high` above).
      channel: both
    low:
      min_score: 1
      action: log_only
  templates:
    call: '{event_type_pl} wykryte. {summary_pl}. Źródła potwierdzające: {source_count}.
      Pilność: {urgency_score} na 10.'
    sms: '🚨 PROJECT SENTINEL: {event_type_pl}

      Pilność: {urgency_score}/10

      Kraje: {affected_countries_str}

      Agresor: {aggressor}


      {summary_pl}


      Źródła ({source_count}):

      {sources_list}


      Wykryto: {first_seen_at_local}'
    sms_update: 'ℹ️ PROJECT SENTINEL UPDATE: {event_type_pl}

      Nowe informacje ({new_source_name}):

      {summary_pl}


      Łącznie źródeł: {source_count}

      Pilność: {urgency_score}/10'
  acknowledgment:
    call_duration_threshold_seconds: 15
    max_call_retries: 5
    retry_interval_minutes: 5
    cooldown_hours: 6
  # Cross-cycle phone-call retry bound. The durable per-event
  # events.alert_round_count bounds ONLY the transport-FAILURE retry loop: a round
  # in which no call reached the user (a full Twilio/network outage — every
  # placement failed) increments the counter, and at max_rounds the event moves to
  # alert_status="failed_terminal" so a permanently unreachable phone can't loop
  # forever. A DELIVERED-but-unacknowledged round (Twilio accepted the call, the
  # phone rang, the operator has not replied yet) does NOT count and keeps ringing
  # every interval until acknowledged — a delivered urgency-9/10 alarm must never
  # fall silent after a fixed number of unanswered rounds. A terminal event (and
  # new content merging into it) still falls back to SMS + additive push. This is
  # the ONLY retry bound in the system. Life-safety: keep
  # max_rounds high enough that a real 9-10 survives a transient outage — total
  # transport-failure call attempts before terminal are up to
  # max_rounds x max_call_retries.
  #
  # sweep_max_age_minutes bounds the cycle-driven retry sweep by recency: only
  # events whose LAST activity (last_updated_at) is within this window are
  # re-called. An actively-retrying event bumps last_updated_at every round so it
  # stays in-window; a stale row left by a historical event ages out and is NOT
  # re-called, so a deploy can't re-activate every historical row at once (a
  # --test-alert resolves its own synthetic event, so it never lingers). Keep the
  # window well above max_rounds x retry_interval_minutes so a real in-progress
  # retry never ages out mid-sequence (config load enforces window > interval).
  # sweep_notify_max_age_minutes: an event aged out of the re-call window but whose
  # last activity is still within THIS larger window is a RECENTLY-stranded call-tier
  # event (e.g. a process outage longer than sweep_max_age_minutes) — it is finalized
  # failed_terminal AND notified via the SMS+push fallback. An event older than this
  # is stale (a pre-existing historical row) and is finalized with an error log only,
  # so a post-deploy backlog does not spam the operator about weeks-old events.
  # sweep_max_events_per_cycle caps how many events the sweep drives through a
  # (blocking) call round per scheduler cycle, and sweep_max_seconds_per_cycle caps
  # the wall-clock time it may spend doing so, so a backlog of unacknowledged events
  # cannot hold the pipeline cycle lock long enough to starve detection of a NEW
  # incident; the rest wait for the next cycle (0 disables each bound).
  retry:
    max_rounds: 10
    sweep_max_age_minutes: 180
    sweep_notify_max_age_minutes: 1440
    sweep_max_events_per_cycle: 3
    sweep_max_seconds_per_cycle: 120
scheduler:
  fast_interval_minutes: 3
  interval_minutes: 15
  jitter_seconds: 30
database:
  path: /var/lib/sentinel/sentinel.db
  article_retention_days: 30
  event_retention_days: 90
logging:
  level: INFO
  file: /var/log/sentinel/sentinel.log
  max_size_mb: 50
  backup_count: 5
dedup:
  # Pre-dedup event-creation gate (replaces the hardcoded corroborator
  # _MIN_EVENT_URGENCY). A classification below this urgency does not create an
  # event row (its classification is still persisted). The is_military_event drop
  # is exempted in code for debris_found / official_statement so an sms-tier
  # meta-event survives to the deduplicator.
  min_event_urgency: 5
testing:
  dry_run: false
  # Owner correctness gate: the blind human-labeled set (`./run.sh --eval`).
  eval_set_file: tests/fixtures/eval_set_human.yaml
  # Report-only regression set (frozen past classifier behavior); run non-gating
  # alongside the gate eval.
  regression_eval_set_file: tests/fixtures/eval_set.yaml
