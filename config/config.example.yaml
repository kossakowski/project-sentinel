# -----------------------------------------------------------------------------
# GEOGRAPHY -- Country-level geo tiers (no gazetteer / city list)
# -----------------------------------------------------------------------------
geography:
  # Whole countries treated as HIGH geo-tier: a military strike anywhere on their
  # soil (including their capital) is call-tier-eligible. Romania joined the
  # monitored HIGH set 2026-07. Country resolution stays LLM-driven and
  # country-level -- there is NO gazetteer/city list (a strike in "Galați"
  # resolves to Romania exactly as "Warsaw" resolves to Poland).
  high_tier_countries:
    - PL
    - LT
    - LV
    - EE
    - RO
  # Classifier event_type values counted as a kinetic strike. Consumed by the
  # GeoWeighter (the Poland floor below) and the event-dedup kinetic separator.
  # Deliberately EXCLUDES debris_found / official_statement: inert-debris recovery
  # and reaction stories are not kinetic strikes (debris found in Poland is 8/sms,
  # not a phone call).
  kinetic_event_types:
    - invasion
    - airstrike
    - missile_strike
    - artillery_shelling
    - drone_attack
  # Countries whose soil, when a kinetic strike lands on it, floors the event to
  # the call tier (>= 9) regardless of the LLM's number. Poland only: every kinetic
  # strike on Polish soil in the labeled ground truth is 9-10/call, while
  # Baltic/Romanian call-tier is scenario-conditional (carried by the classifier
  # prompt and the eval gates, not a universal floor).
  floor_countries:
    - PL
  # Countries the classifier may name that are KNOWN but not HIGH: their soil is
  # LOW geo tier (interior Ukraine / Moldova / Russia). Only a country listed here
  # (or in high_tier_countries) can demote an urgency 9-10 to an SMS -- an
  # UNRECOGNIZED country token is treated as UNKNOWN and fails OPEN to a phone call
  # (prime directive: never miss a 9-10).
  low_tier_countries:
    - UA
    - MD
    - RU
    - BY
  # Countries whose soil, when attacked BY a NATO member, is HIGH geo tier (the
  # "NATO attacks Russia" case: the alliance is now kinetically engaged).
  nato_attack_targets:
    - RU

