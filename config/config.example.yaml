    - name: TVN24
      url: https://tvn24.pl/najnowsze.xml
      language: pl
      enabled: true
      priority: 1

    - name: RMF24
      url: https://www.rmf24.pl/feed
      language: pl
      enabled: true
      priority: 1

    - name: Polsat News
