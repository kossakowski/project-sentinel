    session_name: sentinel_session

# -----------------------------------------------------------------------------
# PROCESSING -- Deduplication settings
# -----------------------------------------------------------------------------
processing:
  dedup:
    same_source_title_threshold: 85
    cross_source_title_threshold: 95
    lookback_minutes: 60

# -----------------------------------------------------------------------------
# CLASSIFICATION -- LLM settings
# -----------------------------------------------------------------------------
classification:
  model: claude-haiku-4-5-20251001
  max_tokens: 512
  temperature: 0.0
  # Sliding window measured from an event's LAST activity (last_updated_at): a new
  # article merges if it arrives within this many minutes of the event's most recent
  # article. Wider absorbs multi-hour incident reporting; too narrow fragments one
  # real incident into multiple Event rows.
  corroboration_window_minutes: 360
  # Absolute cap (measured from first_seen_at) on total event lifetime, so a
  # perpetually-updated event can't live forever and chain-merge genuinely distinct
  # incidents. 0 disables the cap. 2880 = 48h.
  corroboration_max_age_minutes: 2880
  # rapidfuzz.fuzz metric for matching two summaries to the same event. token_set_ratio
  # is length-robust (a short wire headline and a long elaboration of the same incident
  # still score high); token_sort_ratio is length-sensitive. One of:
  # ratio, partial_ratio, token_sort_ratio, token_set_ratio, WRatio, QRatio.
  summary_similarity_metric: token_set_ratio
  # Similarity (0-100) at/above which two summaries are treated as the same event;
  # lower = more aggressive grouping.
  summary_similarity_threshold: 50

# -----------------------------------------------------------------------------
# ALERTS -- Notification settings
# -----------------------------------------------------------------------------
alerts:
  phone_number: "${ALERT_PHONE_NUMBER}"
  language: pl

  # Urgency -> channel-class bands. This map is the SINGLE source of truth for the
  # alert decision (AlertPolicy reads nothing else): >= 9 -> call, 5-8 -> notify
  # (SMS/push), <= 4 -> none (classification persisted, no alert). Config load
  # rejects a band map with no `call` band, a gap in the 1-10 urgency scale, or an
  # inverted order -- a typo here must not be able to silence the phone call.
  # dedup.min_event_urgency must stay <= the lowest alerting band (see DEDUP).
  channel_bands:
    - min_score: 9
      channel_class: call
    - min_score: 5
      channel_class: notify
    - min_score: 1
      channel_class: none

  # Delivery routing per tier. The CLASS (call / notify / none) comes from
  # channel_bands above; these levels carry the fine-grained delivery channel for a
  # NOTIFY-band event (sms | push | both).
  urgency_levels:
    critical:
      min_score: 9
      action: phone_call
      retry_interval_minutes: 5
    high:
      min_score: 7
      action: sms
      # Delivery channel for this tier: sms | push | both. "both" is
      # behavior-preserving while push is disabled (SMS only); switch to "push"
      # to drop this tier's Twilio SMS cost once a push token is configured.
      channel: both
    medium:
      min_score: 5
      action: sms
      # Delivery channel: sms | push | both (see `high` above).
      channel: both
    low:
      min_score: 1
      action: log_only

  templates:
    call: "{event_type_pl} wykryte. {summary_pl}. Źródła potwierdzające: {source_count}. Pilność: {urgency_score} na 10."
    sms: "\U0001f6a8 PROJECT SENTINEL: {event_type_pl}\nPilność: {urgency_score}/10\nKraje: {affected_countries_str}\nAgresor: {aggressor}\n\n{summary_pl}\n\nŹródła ({source_count}):\n{sources_list}\n\nWykryto: {first_seen_at_local}"
    sms_update: "\u2139\ufe0f PROJECT SENTINEL UPDATE: {event_type_pl}\nNowe informacje ({new_source_name}):\n{summary_pl}\n\nŁącznie źródeł: {source_count}\nPilność: {urgency_score}/10"

  acknowledgment:
    call_duration_threshold_seconds: 15
    max_call_retries: 5
    retry_interval_minutes: 5
    cooldown_hours: 6
    # Phone-call poll/pause durations (seconds). Defaults preserve the original
    # hardcoded behavior. During a call the state machine polls Twilio for call
    # status every call_poll_interval_seconds for up to call_poll_timeout_seconds,
    # and pauses call_retry_pause_seconds between retry attempts in a round.
    call_poll_timeout_seconds: 90
    call_poll_interval_seconds: 5
    call_retry_pause_seconds: 10

  # Cross-cycle phone-call retry bound. The durable per-event
  # events.alert_round_count bounds ONLY the transport-FAILURE retry loop: a round
  # in which no call reached the user (a full Twilio/network outage — every
  # placement failed) increments the counter, and at max_rounds the event moves to
  # alert_status="failed_terminal" so a permanently unreachable phone can't loop
  # forever. A DELIVERED-but-unacknowledged round (Twilio accepted the call, the
  # phone rang, the operator has not replied yet) does NOT count toward the cap and
  # keeps ringing every interval until acknowledged — a delivered urgency-9/10
  # alarm must never fall silent after a fixed number of unanswered rounds. When an
  # event does reach failed_terminal it (and any new content merging into it) still
  # falls back to SMS + additive push. Every failed send is durably recorded (never
  # a silent drop). This is the ONLY retry bound in the system.
  # Life-safety: keep max_rounds high enough that a real 9-10 survives a
  # transient outage — total transport-failure call attempts before terminal are up
  # to max_rounds x max_call_retries.
  # sweep_max_age_minutes bounds the cycle-driven retry sweep by recency: only
  # events whose last activity falls within the window are re-called (config load
  # enforces the window > retry_interval_minutes). sweep_notify_max_age_minutes: an
  # event aged out of the re-call window but still within this larger window is a
  # recently-stranded event (e.g. a process outage) — finalized failed_terminal AND
  # notified via SMS+push; an event older than it is stale and finalized with an
  # error log only (no SMS/push about weeks-old rows). sweep_max_events_per_cycle and
  # sweep_max_seconds_per_cycle bound how many events / how long the sweep drives
  # (blocking) call rounds per scheduler cycle so a backlog can't hold the cycle lock
  # long enough to starve detection of a NEW incident (0 disables each bound).
  retry:
    max_rounds: 10
    sweep_max_age_minutes: 180
    sweep_notify_max_age_minutes: 1440
    sweep_max_events_per_cycle: 3
    sweep_max_seconds_per_cycle: 120

  # Push notifications via the Expo Push Service (companion mobile app).
  # Push is one of the per-tier delivery channels: set an urgency tier's
  # `channel` (above) to push or both to route 5-8 alerts here. Disabled by
  # default, so a tier set to push/both still sends SMS only until a token is
  # added; enable it and paste the token to actually deliver pushes.
  # Read the token off the mobile app's notification panel and add it below
  # (literal "ExponentPushToken[...]" or "${EXPO_PUSH_TOKEN}" from the env).
  # Leave tokens empty when disabled — every "${VAR}" here must resolve at load.
  push:
    enabled: false
    tokens: []
      # - "${EXPO_PUSH_TOKEN}"

# -----------------------------------------------------------------------------
# SCHEDULER
# -----------------------------------------------------------------------------
scheduler:
  # Fast lane: Telegram + priority-1 RSS + Google News
  fast_interval_minutes: 3
  # Slow lane: all sources (GDELT, lower-priority RSS, etc.)
  interval_minutes: 15
  jitter_seconds: 30

# -----------------------------------------------------------------------------
# DATABASE
# -----------------------------------------------------------------------------
database:
  path: data/sentinel.db
  article_retention_days: 30
  event_retention_days: 90

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging:
  level: INFO
  file: logs/sentinel.log
  max_size_mb: 50
  backup_count: 5

# -----------------------------------------------------------------------------
# DEDUP -- Event deduplication / pre-event gate
# -----------------------------------------------------------------------------
dedup:
  # Pre-dedup event-creation gate: a classification below this urgency creates no
  # event row (its classification is still persisted and auditable). MUST stay <=
  # the lowest alerting alerts.channel_bands min_score (5 by default) -- config load
  # rejects a higher value, because an event dropped here dies before dedup, before
  # dispatch, before any alert can fire. The is_military_event drop applies only
  # inside the none band, and never to debris_found / official_statement stories.
  min_event_urgency: 5

# -----------------------------------------------------------------------------
# TESTING
# -----------------------------------------------------------------------------
testing:
  dry_run: false
  # Owner correctness gate: the blind human-labeled set (`./run.sh --eval`).
  eval_set_file: tests/fixtures/eval_set_human.yaml
  # Report-only regression set (frozen past classifier behavior); run non-gating
  # alongside the gate eval.
  regression_eval_set_file: tests/fixtures/eval_set.yaml
