meta:
  title: Owner-labeled over-merge ground truth (Quiz 2)
  reconciled: '2026-07-11'
  rubric_version: 2
  labeler: owner — sole ground truth; never pre-fill, bootstrap, or override
  bands:
    none: urgency <= 4
    sms: urgency 5-8
    call: urgency 9-10
  authoring_intent_disclaimer: authoring_intent is the trap-writer intent, NOT ground truth; where the owner label
    deviates, the label wins
  sealed_reserve: piles 33-62 (UI 31-60) intentionally unlabeled — held back as a blind check; do not add without
    owner grading
  grouping_gate: over-merge count vs label.events must be 0 (any merge of two labeled events fails)
  owner_notes_caveat: owner_notes are verbatim dictation from grading time and may predate reconciliation edits
    (e.g. pile-04 note says 5, label is 2/none; pile-20 note says 8/sms, label is 9/call). The label fields are
    authoritative; notes are rationale color only.
