provenance: Fresh synthetic migration checks authored before direct API calls, 2026-09-20. Labels are engineering expectations, not human-approved ground truth.
cases:
  - id: fresh-pl-precaution
    sequence: pl-scramble
    language: pl
    title: Wojsko poderwało myśliwce w rejonie Rzeszowa
    summary: O 04.10 polskie dowództwo poderwało myśliwce zapobiegawczo z powodu rosyjskich nalotów na Ukrainę. Nie stwierdzono naruszenia polskiej przestrzeni ani nie wydano ostrzeżeń dla mieszkańców.
    band: [5, 6]
    countries: [PL]
    notification: initial
  - id: fresh-pl-precaution-repeat
    sequence: pl-scramble
    language: en
    title: Polish aircraft patrol after Ukrainian air raids
    summary: Another outlet confirms the same 04:10 precautionary deployment near Rzeszow. No incursion or civilian warning has been reported; no additional developments.
    band: [5, 6]
    countries: [PL]
    notification: silent
  - id: fresh-pl-escalation
    sequence: pl-scramble
    language: pl
    title: Alarm dla mieszkańców podczas trwającej operacji pod Rzeszowem
    summary: W ramach tej samej operacji rozpoczętej o 04.10 polskie władze wydały o 04.18 oficjalny nakaz schronienia się mieszkańców Rzeszowa przed nadlatującymi rosyjskimi rakietami. To pierwsze takie ostrzeżenie w tym zdarzeniu.
    band: [9, 10]
    countries: [PL]
    notification: update
  - id: fresh-pl-new-wave
    sequence: pl-scramble
    language: pl
    title: Nowa fala rosyjskich rakiet nad Polską
    summary: Dowództwo potwierdziło, że poprzednia operacja pod Rzeszowem zakończyła się. Teraz odrębna fala rosyjskich rakiet leci nad Lublinem. Wydano nowy nakaz schronienia dla mieszkańców Lublina.
    band: [9, 10]
    countries: [PL]
    notification: initial
  - id: fresh-lt-precaution
    sequence: lt-scramble
