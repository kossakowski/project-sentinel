# Local evaluation settings only. Never loaded by the production classifier.
version: 1
model: jev-1.13.0
endpoint: https://api.typesafe.ai/v1/systemone
input_per_million: 0.042
request_token_limit: 64000
state_question_token_limit: 32000
timeout_seconds: 30
# Fixed before evaluation; never inferred from the expected answers.
attack_countries: [PL, LT, LV, EE, UA, RU, BY]
# Diagnostic reporting only; this is NOT an alert/fallback threshold.
confidence_review_threshold: 0.9

# Stage-two evaluation only: explicit names, full runtime fields, source spans.
question_version: jev-pipeline-v3-scope
country_names:
  PL: Poland (Polska, Польша, Польща)
  LT: Lithuania (Litwa, Литва); distinct from Latvia
  LV: Latvia (Łotwa, Латвия, Латвія); distinct from Lithuania
  EE: Estonia (Estonia, Эстония, Естонія)
  UA: Ukraine (Ukraina, Украина, Україна)
  RU: Russia (Rosja, Россия, Росія)
  BY: Belarus (Białoruś, Беларусь, Білорусь)
event_types:
  invasion: Offensive ground invasion.
  airstrike: Military air attack not more specifically identified.
  missile_strike: Missile impact on a target.
  border_crossing: Hostile ground border crossing.
  airspace_violation: Hostile airborne weapon or military aircraft in national airspace.
  naval_blockade: Military naval blockade.
  cyber_attack: Hostile military cyberattack.
  troop_movement: Deployment or precautionary military activity.
  artillery_shelling: Artillery attack.
  drone_attack: Hostile military drone attack or discovery.
  other: Other relevant military incident, threat or protective response.
  none: No military incident or relevant protective response.
summary_max_tokens: 512
